[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mag"
version = "0.4.0"
description = "Mac Agent Gateway - Local macOS HTTP API gateway for Apple services"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Eric Blue" }
]
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "jinja2>=3.1.0",
    "slowapi>=0.1.9",
    "macnotesapp>=0.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
    "cryptography>=42.0.0",
]
signing = [
    "cryptography>=42.0.0",
]
mcp = [
    # Pinned to 1.x: mcp 2.x renames FastMCP->MCPServer and changes other APIs. 1.29.1 is
    # verified working in both Claude Code and Cowork; keep the pin until 2.x is tested on
    # both surfaces.
    "mcp>=1.2.0,<2",
    "httpx>=0.26.0",
]

[project.scripts]
mag = "mag.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mag", "src/mag_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
